# Third-party provenance manifest for the RNA target-wise screening benchmark.
# Date audited: 2026-06-16
#
# This file records local third-party source trees used during exploration or
# manuscript preparation. It is intentionally a provenance manifest, not a
# vendoring manifest. The primary public repository should not include complete
# external source trees unless the release plan explicitly says so.

release_policy:
  primary_repository_role: benchmark_protocol_and_reproduction_glue
  default_external_code_policy: exclude_full_external_trees
  preferred_reproduction_boundary:
    - pin_upstream_url_and_commit
    - provide_install_or_clone_instructions
    - provide small compatibility patches only when needed and license-scoped
    - archive aggregate benchmark outputs and smoke-test fixtures
  never_bundle_by_default:
    - model checkpoints
    - raw upstream datasets with unclear redistribution rights
    - generated feature caches
    - local IDE files
    - nested .git directories
    - internal roadmaps, worklogs, and review notes

sources:
  - id: deeprna_dti
    name: DeepRNA-DTI
    local_path: DeepRNA-DTI
    upstream_url: https://github.com/GIST-CSBL/DeepRNA-DTI.git
    upstream_commit: 8389ba97015da8336d73b6483c3e71ddce4adf9a
    license_observed: CC-BY-NC-SA-4.0
    license_file_observed: DeepRNA-DTI/CC-BY-NC-SA-4.0
    paper_role: partial resource-suitability anchor; not the main paired target-wise benchmark
    local_status_summary:
      tracked_modified_or_deleted_count: 5
      untracked_entry_count: 23086
      untracked_code_like_count: 73
      untracked_data_model_doc_like_count: 23018
    tracked_modified_files:
      - src/data_utils.py
      - src/model.py
      - src/utils.py
      - test.py
      - train.py
    local_added_code_like_paths:
      - configs/deeprna_dti_v0/
      - src/rna_adapters.py
      - src/rna_encoders/
    local_generated_or_downloaded_paths:
      - cache/
      - Model/trained_weight/
      - 13321_2025_1132_MOESM1_ESM.docx
    release_action: exclude_from_primary_public_repository
    reproduction_action:
      - cite upstream URL and commit
      - do not redistribute local cache or trained weights unless upstream permissions are verified
      - if DeepRNA-DTI-specific reproduction is required, create a separate fork or archive under the observed upstream license
      - keep any compatibility patch outside the primary repository until its license boundary is reviewed
    risk_level: high
    risk_notes:
      - local changes are larger than a simple device-index adaptation
      - untracked cache and feature artifacts are extensive
      - non-commercial share-alike license is not suitable for mixing into a permissively licensed primary repo

